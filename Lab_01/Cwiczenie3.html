<!DOCTYPE html>
<html>
<head>

<style>
.container {
  display: grid;
  grid-template-columns: repeat(3, 100px);
  grid-template-rows: repeat(2, 100px);
  /*background-color: dodgerblue;*/
  gap: 15px;
}


.square {
  width:100px;
  height:100px;
  /*margin:10px;*/
  object-fit: fill;
}
</style>
<title>Cwiczenie 3</title>
</head>
<body>
<div class="container">
    <div class ="square" style="background:rgb(247, 143, 204);grid-row: 1; grid-column: 1;"></div>

    <div class ="square" style="background:rgb(217, 136, 61);grid-row: 1; grid-column: 2;"></div>

    <div class ="square" style="background:rgb(227, 209, 241);grid-row: 2; grid-column: 1;"> </div>

    <img class="square" src = "jamnik.jpg" alt="Obrazek przedstawia jamnika."; style = "grid-row: 2; grid-column: 2";>

    <div class ="square" style="background:rgb(25, 203, 9);grid-row: 2; grid-column: 3;"></div>
</div>
</body>
</html>
